[package]
name = "terminal-lock-lib"
version = {workspace = true}
edition = {workspace = true}
# authors = ["Moses <moses.muranja@strathmore.edu>"]
description = "Core library for the terminal-lock system"
license = "MIT"
repository = "https://github.com/yourusername/terminal-lock"

[dependencies]
# Re-export all the workspace crates
terminal-lock-core = { path = "../core" }
terminal-lock-auth = { path = "../auth" }
terminal-lock-ui = { path = "../ui" }
terminal-lock-config = { path = "../config" }
terminal-lock-quotes = { path = "../quotes" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[dev-dependencies]
tempfile = "3.2"

[features]
default = []